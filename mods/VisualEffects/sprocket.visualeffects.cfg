[Smoke]
## 1 = modern smokeless 120/125 mm gun (0.3.1 defaults). Change and restart the game; no rebuild needed.
## Number of smoke puffs per shot (1 = ~16 at 120 mm; 0 = no smoke). Range 0-2.
SmokeAmount = 1
## Smoke puff size (1 = grows to 4-7 m). Range 0.5-2.
SmokeSize = 1
## How long smoke lingers (1 = 2-4 s, mostly gone after 1.5-3 s). Range 0.5-2.
SmokeLifetime = 1
## Smoke colour brightness (1 = mid grey in full sun; higher = whiter, lower = darker). Range 0.3-1.5.
SmokeBrightness = 1
## Ground dust kicked up per shot (1 = ~18 low sand puffs lasting 3-6 s; 0 = none). Range 0-2.
DustAmount = 1

[Diagnostics]
DetailedLogging = true

